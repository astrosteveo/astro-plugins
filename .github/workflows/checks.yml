name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned, so a new release's validator can't fail a PR that changed nothing. Raise it on purpose.
      - name: Install Claude Code
        run: npm install -g --ignore-scripts @anthropic-ai/claude-code@2.1.309
      - name: Validate the marketplace and both manifests
        run: claude plugin validate --strict .
      - name: Validate solo-review's skills, agents and hooks
        run: claude plugin validate --strict plugins/solo-review
      - name: Validate web-reader's skill
        run: claude plugin validate --strict plugins/web-reader
      - name: Test solo-review's hooks module
        run: claude plugin test plugins/solo-review
      - name: Check that webread.py loads
        run: python3 -B plugins/web-reader/scripts/webread.py --help > /dev/null
